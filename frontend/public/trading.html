<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Leverage Trading — GANG DEX</title>
<link rel="icon" type="image/png" href="/gang-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a12;--s1:#12121e;--s2:#1a1a2e;--border:#ffd70020;--gold:#ffd700;--orange:#ff8c00;--green:#00c853;--red:#f44;--purple:#8b5cf6;--text:#e8e0d0;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:12px 15px 80px;}
h1{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 4px;}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px;}

/* Revenue Banner */
.revenue-banner{background:linear-gradient(135deg,#1a0a2e,#0a1a2e);border:1px solid var(--purple);border-radius:14px;padding:16px;margin-bottom:16px;display:none;}
.revenue-banner.show{display:block;}
.rev-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--purple);margin-bottom:10px;}
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.rev-item{background:rgba(139,92,246,0.08);border-radius:8px;padding:10px;text-align:center;}
.rev-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.rev-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);}
.rev-btn{width:100%;background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;border:none;padding:12px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;}

.connect-btn{width:100%;background:linear-gradient(90deg,var(--gold),var(--orange));color:#000;border:none;padding:16px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;}
.balance-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px;}
.pairs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.pair-card{background:rgba(255,255,255,0.03);padding:12px 6px;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #333;transition:all .15s;}
.pair-card.active{border-color:var(--gold);background:rgba(255,215,0,0.08);}
.pair-icon{font-size:22px;margin-bottom:4px;}
.pair-symbol{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;color:#ccc;}
.pair-price{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);}
.panel{background:var(--s1);border-radius:14px;padding:18px;border:1px solid var(--border);margin-bottom:16px;}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.pair-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.price-tag{font-family:'Space Mono',monospace;color:var(--gold);font-size:14px;}
.dir-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.dir-btn{padding:14px;border:2px solid #333;border-radius:10px;background:transparent;color:#ccc;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;transition:all .15s;}
.dir-btn.long-active{border-color:var(--green);background:rgba(0,200,83,0.1);color:var(--green);}
.dir-btn.short-active{border-color:var(--red);background:rgba(255,68,68,0.1);color:var(--red);}
.section{margin-bottom:14px;}
.label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:1px;}
.lev-row{display:flex;gap:6px;}
.lev-btn{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;background:#333;color:#fff;transition:all .15s;}
.lev-btn.active{background:var(--gold);color:#000;}
.amount-row{display:flex;gap:8px;}
.input{flex:1;background:rgba(255,255,255,0.06);border:1px solid #333;border-radius:8px;padding:12px;color:#fff;font-size:16px;font-family:'Space Mono',monospace;}
.max-btn{background:var(--gold);color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
.info-box{background:rgba(255,255,255,0.02);border-radius:10px;padding:12px;margin-bottom:14px;}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--muted);}
.open-btn{width:100%;border:none;padding:16px;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;color:#fff;}
.open-btn:disabled{opacity:0.5;}
.positions{margin-top:16px;}
.pos-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold);margin-bottom:10px;}
.pos-card{background:rgba(255,255,255,0.03);border-radius:10px;padding:14px;margin-bottom:8px;border-left:3px solid var(--green);}
.pos-card.short{border-left-color:var(--red);}
.pos-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;}
.pos-pair{font-weight:700;color:#fff;}
.pos-dir{font-weight:700;}
.pos-dir.long{color:var(--green);}
.pos-dir.short{color:var(--red);}
.pos-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:11px;color:var(--muted);margin-bottom:8px;}
.close-btn{width:100%;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.3);color:var(--red);padding:8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 22px;border-radius:10px;font-weight:600;z-index:1000;font-size:14px;display:none;}
.toast.show{display:block;}
.back-link{display:block;text-align:center;color:var(--gold);text-decoration:none;font-size:14px;padding:10px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">

<!-- Owner Revenue Banner -->
<div class="revenue-banner" id="revBanner" data-testid="trading-revenue-banner">
  <div class="rev-title">TRADING REVENUE</div>
  <div class="rev-grid">
    <div class="rev-item"><div class="rev-label">Total Fees Earned</div><div class="rev-val" id="revFees">0</div></div>
    <div class="rev-item"><div class="rev-label">Fee Rate</div><div class="rev-val">0.1%</div></div>
  </div>
  <button class="rev-btn" onclick="collectRevenue()" data-testid="collect-trading-revenue">COLLECT TRADING FEES</button>
</div>

<h1>LEVERAGE TRADING</h1>
<p class="subtitle">Trade BTC, ETH, SOL & more with up to 100x leverage</p>

<div id="connectArea">
  <button class="connect-btn" onclick="connectWallet()" data-testid="trading-connect-btn">CONNECT WALLET</button>
</div>

<div id="tradingArea" style="display:none">
  <div class="balance-bar">
    <span>Balance: <strong style="color:var(--gold)" id="tBalance">0</strong> $GANG</span>
    <span id="tWallet" style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted)"></span>
  </div>

  <div class="pairs-grid" id="pairsGrid"></div>

  <div class="panel">
    <div class="panel-header">
      <span class="pair-title" id="panelPair">BTC/USD</span>
      <span class="price-tag" id="panelPrice">$—</span>
    </div>
    <div class="dir-row">
      <button class="dir-btn long-active" id="btnLong" onclick="setDir('long')" data-testid="trade-long">LONG</button>
      <button class="dir-btn" id="btnShort" onclick="setDir('short')" data-testid="trade-short">SHORT</button>
    </div>
    <div class="section">
      <label class="label">Leverage</label>
      <div class="lev-row" id="levRow"></div>
    </div>
    <div class="section">
      <label class="label">Amount ($GANG)</label>
      <div class="amount-row">
        <input type="number" class="input" id="tradeAmount" value="10" min="5" data-testid="trade-amount"/>
        <button class="max-btn" onclick="document.getElementById('tradeAmount').value=Math.floor(balance)" data-testid="trade-max">MAX</button>
      </div>
    </div>
    <div class="info-box" id="tradeInfo"></div>
    <button class="open-btn" id="openBtn" onclick="openPosition()" data-testid="open-position-btn">OPEN 10x LONG</button>
  </div>

  <div class="positions" id="positionsArea"></div>
</div>

<div class="toast" id="toast"></div>
<a href="/cronos-gangsters.html" class="back-link" data-testid="back-to-dapp">BACK TO GANG DEX</a>
</div>

<script>
var API = window.location.origin + '/api';
var wallet = null, balance = 0, pairs = [], selectedPair = 'BTC', direction = 'long', leverage = 10, positions = {open:[],closed:[]};
var OWNER_WALLET = '0xaA3C5749628610fF410EF9133a4ac4f58e9A52eA';

function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; setTimeout(function(){t.className='toast';},3000); }

async function fetchPairs() {
  try { var r=await fetch(API+'/trading/pairs'); var d=await r.json(); if(d.success) { pairs=d.pairs; renderPairs(); updatePanel(); } } catch(e){}
}

async function fetchBalance() {
  if(!wallet) return;
  try { var r=await fetch(API+'/mining/user/'+wallet); var d=await r.json(); if(d.success) { balance=d.balance; document.getElementById('tBalance').textContent=balance.toFixed(2); } } catch(e){}
}

async function fetchPositions() {
  if(!wallet) return;
  try { var r=await fetch(API+'/trading/positions/'+wallet); var d=await r.json(); if(d.success) { positions={open:d.open_positions,closed:d.closed_positions}; renderPositions(); } } catch(e){}
}

async function fetchRevenue() {
  if(!wallet || wallet.toLowerCase() !== OWNER_WALLET.toLowerCase()) return;
  try { var r=await fetch(API+'/trading/admin/stats'); var d=await r.json(); if(d.success) {
    document.getElementById('revBanner').className='revenue-banner show';
    document.getElementById('revFees').textContent=Math.round(d.total_fees_earned||0);
  }} catch(e){}
}

async function connectWallet() {
  if(!window.ethereum) { showToast('Open in wallet browser!'); return; }
  try {
    var accs = await window.ethereum.request({method:'eth_requestAccounts'});
    wallet = accs[0];
    await fetch(API+'/mining/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wallet_address:wallet})});
    document.getElementById('connectArea').style.display='none';
    document.getElementById('tradingArea').style.display='block';
    document.getElementById('tWallet').textContent=wallet.slice(0,6)+'...'+wallet.slice(-4);
    fetchBalance(); fetchPositions(); fetchRevenue();
  } catch(e){ showToast('Failed to connect'); }
}

function setDir(d) { direction=d; document.getElementById('btnLong').className='dir-btn'+(d==='long'?' long-active':''); document.getElementById('btnShort').className='dir-btn'+(d==='short'?' short-active':''); updatePanel(); }

function setLev(l) { leverage=l; renderLeverage(); updatePanel(); }

function renderPairs() {
  document.getElementById('pairsGrid').innerHTML = pairs.map(function(p){
    return '<div class="pair-card'+(selectedPair===p.symbol?' active':'')+'" onclick="selectedPair=\''+p.symbol+'\';renderPairs();updatePanel()" data-testid="pair-'+p.symbol.toLowerCase()+'">'+
      '<div class="pair-icon">'+p.icon+'</div><div class="pair-symbol">'+p.symbol+'</div><div class="pair-price">$'+(p.price?p.price.toLocaleString(undefined,{maximumFractionDigits:6}):'...')+'</div></div>';
  }).join('');
}

function renderLeverage() {
  document.getElementById('levRow').innerHTML = [10,25,50,100].map(function(l){
    return '<button class="lev-btn'+(leverage===l?' active':'')+'" onclick="setLev('+l+')" data-testid="lev-'+l+'">'+l+'x</button>';
  }).join('');
}

function updatePanel() {
  var cp = pairs.find(function(p){return p.symbol===selectedPair;});
  document.getElementById('panelPair').textContent = (cp?cp.icon:'')+' '+selectedPair+'/USD';
  document.getElementById('panelPrice').textContent = '$'+(cp&&cp.price?cp.price.toLocaleString(undefined,{maximumFractionDigits:6}):'—');
  var amt = parseFloat(document.getElementById('tradeAmount').value) || 10;
  document.getElementById('tradeInfo').innerHTML =
    '<div class="info-row"><span>Position Size</span><span>'+(amt*leverage).toFixed(2)+' $GANG</span></div>'+
    '<div class="info-row"><span>Fee (0.1%)</span><span>'+(amt*0.001).toFixed(4)+' $GANG</span></div>'+
    '<div class="info-row"><span>Liquidation</span><span style="color:var(--red)">'+(direction==='long'?'-':'+')+(100/leverage).toFixed(1)+'%</span></div>';
  document.getElementById('openBtn').textContent = 'OPEN '+leverage+'x '+direction.toUpperCase();
  document.getElementById('openBtn').style.background = direction==='long'?'linear-gradient(90deg,var(--green),#00a843)':'linear-gradient(90deg,var(--red),#c00)';
}

async function openPosition() {
  var amt = parseFloat(document.getElementById('tradeAmount').value);
  if(amt>balance) { showToast('Not enough $GANG!'); return; }
  try {
    var r = await fetch(API+'/trading/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wallet_address:wallet,pair:selectedPair,direction:direction,leverage:leverage,amount:amt})});
    var d = await r.json();
    showToast(d.success?d.message:(d.error||'Failed'));
    fetchBalance(); fetchPositions();
  } catch(e){ showToast('Failed'); }
}

async function closePos(id) {
  try {
    var r = await fetch(API+'/trading/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wallet_address:wallet,position_id:id})});
    var d = await r.json();
    showToast(d.success?d.message:(d.error||'Failed'));
    fetchBalance(); fetchPositions();
  } catch(e){ showToast('Failed'); }
}

function renderPositions() {
  var html = '';
  if(positions.open.length > 0) {
    html += '<div class="pos-title">OPEN POSITIONS</div>';
    positions.open.forEach(function(p){
      html += '<div class="pos-card'+(p.direction==='short'?' short':'')+'">'+
        '<div class="pos-header"><span class="pos-pair">'+p.pair+'/USD</span><span class="pos-dir '+(p.direction)+'">'+(p.direction==='long'?'LONG':'SHORT')+' '+p.leverage+'x</span></div>'+
        '<div class="pos-details"><div>Entry: $'+p.entry_price.toFixed(2)+'</div><div>Size: '+p.amount.toFixed(2)+'</div><div>PnL: <span style="color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+(p.pnl>=0?'+':'')+p.pnl.toFixed(2)+'</span></div></div>'+
        '<button class="close-btn" onclick="closePos(\''+p.position_id+'\')" data-testid="close-pos-'+p.position_id+'">CLOSE POSITION</button></div>';
    });
  }
  if(positions.closed.length > 0) {
    html += '<div class="pos-title" style="margin-top:16px;opacity:0.6">RECENT CLOSED</div>';
    positions.closed.slice(0,5).forEach(function(p){
      html += '<div class="pos-card" style="opacity:0.5;border-left-color:var(--muted)">'+
        '<div class="pos-header"><span class="pos-pair">'+p.pair+'/USD</span><span style="color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+(p.pnl>=0?'+':'')+p.pnl.toFixed(2)+' $GANG</span></div></div>';
    });
  }
  document.getElementById('positionsArea').innerHTML = html;
}

function collectRevenue() { showToast('Revenue collection requires on-chain withdrawal from contract'); }

// Init
document.getElementById('tradeAmount').addEventListener('input', updatePanel);
fetchPairs(); renderLeverage(); updatePanel();
setInterval(fetchPairs, 5000);
if(window.ethereum) {
  window.ethereum.request({method:'eth_accounts'}).then(function(accs){
    if(accs.length > 0) { wallet=accs[0]; document.getElementById('connectArea').style.display='none'; document.getElementById('tradingArea').style.display='block'; document.getElementById('tWallet').textContent=wallet.slice(0,6)+'...'+wallet.slice(-4); fetchBalance(); fetchPositions(); fetchRevenue(); }
  });
}
</script>
</body>
</html>
