:root{--bg:#0a0a12;--gold:#ffd700;--orange:#ff8c00;--green:#0f8;--red:#f44;--text:#e8e0d0;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#14141f;border-radius:20px;padding:30px;max-width:420px;width:100%;border:1px solid rgba(255,215,0,0.2);text-align:center;}
h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;}
.wallet-badge{background:rgba(0,255,136,0.08);padding:10px;border-radius:8px;margin-bottom:16px;color:var(--green);font-family:'Space Mono',monospace;font-size:13px;}
.deploy-btn{width:100%;background:linear-gradient(90deg,var(--gold),var(--orange));color:#000;border:none;padding:18px;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;}
.deploy-btn:disabled{opacity:0.5;cursor:not-allowed;}
.status-box{margin-top:14px;padding:12px;border-radius:8px;font-size:14px;}
.status-box.pending{background:rgba(255,255,0,0.05);}
.status-box.success{background:rgba(0,255,0,0.05);}
.status-box.error{background:rgba(255,0,0,0.05);}
.success-card{background:rgba(0,255,0,0.03);padding:20px;border-radius:12px;border:1px solid rgba(0,255,136,0.2);}
.success-card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--green);margin:10px 0;}
.addr-box{display:block;background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;font-family:'Space Mono',monospace;font-size:11px;word-break:break-all;color:var(--gold);cursor:pointer;margin:10px 0;border:none;width:100%;text-align:center;}
.next-step{margin-top:14px;padding:10px;background:rgba(255,215,0,0.1);border-radius:8px;font-size:14px;color:#ccc;}
.info-box{margin-top:20px;padding:14px;background:rgba(255,255,255,0.03);border-radius:10px;text-align:left;font-size:14px;color:var(--muted);}
.info-box p{margin-bottom:6px;}
.back-link{display:block;text-align:center;color:var(--gold);text-decoration:none;font-size:14px;padding:16px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}

  <div id="deployArea">
    <button class="deploy-btn" id="deployBtn" onclick="deploy()" data-testid="deploy-contract-btn">DEPLOY NOW</button>
  </div>

  <div id="statusBox" style="display:none" class="status-box"></div>

  <div id="successArea" style="display:none"></div>

  <div class="info-box">
    <p><strong style="color:#ccc">Token:</strong> $GANG</p>
    <p><strong style="color:#ccc">Network:</strong> Cronos Mainnet</p>
    <p><strong style="color:#ccc">Functions:</strong> sendReward, withdrawAll, getBalance</p>
    <p style="margin-top:8px;font-size:12px;color:#555">Deploys a GANGRewards contract where you can send $GANG tokens and distribute rewards.</p>
  </div>
</div>
<a href="/cronos-gangsters.html" class="back-link" data-testid="back-to-dapp">BACK TO GANG DEX</a>
</div>

var ABI = [{"inputs":[{"internalType":"address","name":"_token","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},{"inputs":[],"name":"balance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"send","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"token","outputs":[{"internalType":"contract IERC20","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"}];

function setStatus(msg, type) {
  var box = document.getElementById('statusBox');
  box.style.display = 'block';
  box.className = 'status-box ' + (type || 'pending');
  box.textContent = msg;
}

async function deploy() {
  if (!window.ethereum) { setStatus('Open this page in your wallet browser!', 'error'); return; }
  var btn = document.getElementById('deployBtn');
  btn.disabled = true; btn.textContent = 'DEPLOYING...';
  try {
    setStatus('Connecting wallet...');
    var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    var wallet = accounts[0];
    document.getElementById('walletBadge').style.display = 'block';
    document.getElementById('walletBadge').textContent = wallet.slice(0,6) + '...' + wallet.slice(-4);

    var chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (parseInt(chainId, 16) !== 25) {
      setStatus('Switching to Cronos Mainnet...');
      try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x19' }] }); } catch(e) { setStatus('Please switch to Cronos Mainnet!', 'error'); btn.disabled=false; btn.textContent='DEPLOY NOW'; return; }
    }

    setStatus('Deploying contract — confirm in wallet...');
    var provider = new ethers.providers.Web3Provider(window.ethereum);
    var signer = provider.getSigner();
    var factory = new ethers.ContractFactory(ABI, BYTECODE, signer);
    var contract = await factory.deploy(GANG_TOKEN);
    setStatus('TX sent! Confirming on blockchain...');
    await contract.deployed();

    document.getElementById('deployArea').style.display = 'none';
    document.getElementById('statusBox').style.display = 'none';
    document.getElementById('successArea').style.display = 'block';
    document.getElementById('successArea').innerHTML =
      '<div class="success-card"><div style="font-size:40px">&#9989;</div><h2>CONTRACT DEPLOYED!</h2>' +
      '<p style="color:var(--muted);font-size:13px;margin-bottom:6px">Address:</p>' +
      '<button class="addr-box" onclick="navigator.clipboard.writeText(\'' + contract.address + '\');this.textContent=\'COPIED!\';setTimeout(function(){this.textContent=\'' + contract.address + '\'}.bind(this),1500)" data-testid="deployed-address">' + contract.address + '</button>' +
      '<div class="next-step">Now send $GANG tokens to this address to fund rewards!</div></div>';
  } catch(err) {
    console.error(err);
    var msg = err.code === 4001 ? 'Transaction rejected' :
              err.message && err.message.includes('insufficient') ? 'Not enough CRO for gas!' :
              (err.reason || err.message || 'Failed').slice(0, 150);
    setStatus('Error: ' + msg, 'error');
    btn.disabled = false; btn.textContent = 'DEPLOY NOW';
  }
}
