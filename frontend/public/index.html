<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Redirect to DApp only for root path, let React handle /mining, /trading, /deploy, /deploy-farms
(function() {
  var p = window.location.pathname;
  var reactRoutes = ['/mining', '/trading', '/deploy', '/deploy-farms'];
  var isReactRoute = reactRoutes.some(function(r) { return p === r || p.startsWith(r + '/'); });
  if (!isReactRoute && (p === '/' || p === '/index.html')) {
    var h = window.location.hash || '';
    window.location.replace('/cronos-gangsters.html' + h);
  }
})();
</script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#000000"/>
<meta name="description" content="Cronos Gangsters - The Most Gangster DEX on Cronos"/>
<link rel="icon" href="/gang-logo.png"/>
<title>Cronos Gangsters</title>
</head>

<div id="root"></div>
</body>
</html>
