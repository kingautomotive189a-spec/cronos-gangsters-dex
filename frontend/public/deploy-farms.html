<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deploy Farms — GANG DEX</title>
<link rel="icon" type="image/png" href="/gang-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{--bg:#0a0a12;--surface:#12121e;--border:rgba(255,215,0,0.1);--gold:#ffd700;--gold2:#b8860b;--green:#27ae60;--red:#c0392b;--text:#e8e0d0;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;padding:30px 15px;}
.container{max-width:860px;margin:0 auto;}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;text-align:center;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px;}
.wallet-badge{text-align:center;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);padding:10px;border-radius:10px;margin-bottom:24px;color:#0f8;font-size:13px;font-family:'Space Mono',monospace;}
.connect-btn{display:block;margin:0 auto 24px;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border:none;padding:14px 36px;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
.card{background:var(--surface);border-radius:16px;padding:22px;border:1px solid var(--border);}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.06);}
.token-logos{display:flex;align-items:center;}
.token-logo{width:34px;height:34px;border-radius:50%;border:2px solid #1a1a2e;object-fit:cover;}
.farm-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--gold);}
.step{margin-bottom:16px;}
.step-label{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:#bbb;font-weight:600;}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;color:#000;flex-shrink:0;}
.action-btn{width:100%;background:linear-gradient(135deg,#ffd700,#b8860b);color:#000;border:none;padding:12px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;transition:opacity .2s;}
.action-btn:disabled{opacity:0.5;cursor:not-allowed;}
.action-btn.green{background:linear-gradient(135deg,#27ae60,#1a8a4a);color:#fff;}
.addr-box{background:rgba(0,0,0,0.25);border-radius:8px;padding:10px;border:1px solid rgba(39,174,96,0.2);}
.addr-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.addr-text{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);word-break:break-all;cursor:pointer;}
.success-badge{background:rgba(39,174,96,0.1);border:1px solid rgba(39,174,96,0.35);color:var(--green);padding:10px;border-radius:10px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;}
.status-bar{padding:8px 12px;border-radius:8px;font-size:12px;color:#ddd;margin-top:6px;}
.info-box{background:var(--surface);border-radius:14px;padding:18px;color:#777;font-size:13px;border:1px solid rgba(255,255,255,0.05);margin-bottom:16px;line-height:1.8;}
.back-link{display:block;text-align:center;color:var(--gold);text-decoration:none;font-size:14px;padding:14px;font-weight:600;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="container">
  <h1 data-testid="deploy-farms-title">Deploy New Farms</h1>
  <p class="subtitle">1-Click LP Pair Creation & MasterChef Registration</p>

  <div id="walletArea">
    <button class="connect-btn" onclick="connectWallet()" data-testid="deploy-farms-connect">CONNECT WALLET</button>
  </div>

  <div class="grid" id="farmGrid"></div>

  <div class="info-box">
    <p><strong style="color:#ccc">Network:</strong> Cronos Mainnet (Chain ID 25)</p>
    <p><strong style="color:#ccc">Factory:</strong> VVS Finance</p>
    <p><strong style="color:#ccc">MasterChef:</strong> GangsterChef</p>
    <p style="margin-top:10px;color:#999;font-size:11px">After deploying, go back to the Farms page to stake LP tokens and earn $GANG rewards.</p>
  </div>

  <a href="/cronos-gangsters.html#farms" class="back-link" data-testid="back-to-farms">BACK TO FARMS</a>
</div>

<script>
const CONTRACTS = {
  GANG: "0x4cE15b52a34dE6F62448fDBAdDF1dB4811DDC3EF",
  XRP: "0xb9Ce0dd29C91E02d4620F57a66700Fc5e41d6D15",
  PEPE: "0xf868c454784048AF4f857991583E34243c92Ff48",
  DOGE: "0x1a8E39ae59e5556B56b76fCBA98d22c9ae557396",
  FACTORY: "0x3B44B2a187a7b3824131F8db5a74194D0a42Fc15",
  CHEF: "0x3713567b8DB60D7127B2614965eef71cE50871Ea",
};

const FACTORY_ABI = [
  "function createPair(address tokenA, address tokenB) external returns (address pair)",
  "function getPair(address tokenA, address tokenB) external view returns (address pair)"
];
const CHEF_ABI = [
  "function addPool(uint256 _allocPoint, address _lpToken) external",
  "function poolLength() external view returns (uint256)"
];

const FARMS = [
  { name:"XRP / GANG", tokenA:"XRP", tokenB:"GANG", addrA:CONTRACTS.XRP, addrB:CONTRACTS.GANG, storageKey:"FARM_LP_XRP_GANG", allocPoint:150,
    logo1:"https://assets.coingecko.com/coins/images/44/small/xrp-symbol-white-128.png", logo2:"/gang-logo.png" },
  { name:"PEPE / GANG", tokenA:"PEPE", tokenB:"GANG", addrA:CONTRACTS.PEPE, addrB:CONTRACTS.GANG, storageKey:"FARM_LP_PEPE_GANG", allocPoint:150,
    logo1:"https://assets.coingecko.com/coins/images/29850/small/pepe-token.jpeg", logo2:"/gang-logo.png" },
  { name:"DOGE / GANG", tokenA:"DOGE", tokenB:"GANG", addrA:CONTRACTS.DOGE, addrB:CONTRACTS.GANG, storageKey:"FARM_LP_DOGE_GANG", allocPoint:150,
    logo1:"https://assets.coingecko.com/coins/images/5/small/dogecoin.png", logo2:"/gang-logo.png" },
];

var wallet = '';
var farmStates = FARMS.map(function(f) {
  var lp = localStorage.getItem(f.storageKey) || '';
  // Treat zero address as invalid/failed creation
  if (lp && lp.replace(/0x0*/,'') === '') lp = '';
  return { lpAddr: lp, chefAdded: false, loading: false, status: '' };
});

function renderFarms() {
  var grid = document.getElementById('farmGrid');
  grid.innerHTML = FARMS.map(function(farm, idx) {
    var fs = farmStates[idx];
    return '<div class="card" data-testid="farm-deploy-card-' + farm.tokenA.toLowerCase() + '">' +
      '<div class="card-header">' +
        '<div class="token-logos">' +
          '<img class="token-logo" src="' + farm.logo1 + '" alt="' + farm.tokenA + '" onerror="this.style.display=\'none\'">' +
          '<img class="token-logo" src="' + farm.logo2 + '" alt="GANG" style="margin-left:-8px" onerror="this.style.display=\'none\'">' +
        '</div>' +
        '<div class="farm-name">' + farm.name + '</div>' +
      '</div>' +

      '<div class="step">' +
        '<div class="step-label">' +
          '<span class="step-num" style="background:' + (fs.lpAddr ? '#27ae60' : '#ffd700') + '">' + (fs.lpAddr ? '\u2713' : '1') + '</span>' +
          ' Create LP Pair on VVS Factory' +
        '</div>' +
        (fs.lpAddr ?
          '<div class="addr-box"><div class="addr-label">LP Address:</div><code class="addr-text" onclick="navigator.clipboard.writeText(\'' + fs.lpAddr + '\')" data-testid="lp-addr-' + farm.tokenA.toLowerCase() + '">' + fs.lpAddr + '</code></div>'
          :
          '<button class="action-btn" onclick="createLPPair(' + idx + ')" ' + (fs.loading || !wallet ? 'disabled' : '') + ' data-testid="create-lp-' + farm.tokenA.toLowerCase() + '">' +
            (fs.loading && !fs.lpAddr ? 'CREATING...' : 'CREATE LP PAIR') +
          '</button>'
        ) +
      '</div>' +

      '<div class="step" style="opacity:' + (fs.lpAddr ? '1' : '0.4') + '">' +
        '<div class="step-label">' +
          '<span class="step-num" style="background:' + (fs.chefAdded ? '#27ae60' : (fs.lpAddr ? '#ffd700' : '#333')) + ';color:' + (fs.chefAdded || fs.lpAddr ? '#000' : '#666') + '">' + (fs.chefAdded ? '\u2713' : '2') + '</span>' +
          ' Register on MasterChef' +
        '</div>' +
        (fs.chefAdded ?
          '<div class="success-badge" data-testid="chef-done-' + farm.tokenA.toLowerCase() + '">FARM ACTIVE</div>'
          :
          '<button class="action-btn green" onclick="addToMasterChef(' + idx + ')" ' + (!fs.lpAddr || fs.loading ? 'disabled' : '') + ' data-testid="add-chef-' + farm.tokenA.toLowerCase() + '">' +
            (fs.loading && fs.lpAddr ? 'ADDING...' : 'ADD TO MASTERCHEF') +
          '</button>'
        ) +
      '</div>' +

      (fs.status ?
        '<div class="status-bar" style="background:' +
          (fs.status.includes('Error') || fs.status.includes('rejected') ? 'rgba(255,0,0,0.12)' :
           fs.status.includes('created') || fs.status.includes('activated') || fs.status.includes('exists') || fs.status.includes('Active') ? 'rgba(0,255,0,0.12)' :
           'rgba(255,255,0,0.1)') +
        '" data-testid="status-' + farm.tokenA.toLowerCase() + '">' + fs.status + '</div>'
        : ''
      ) +

    '</div>';
  }).join('');
}

async function connectWallet() {
  if (!window.ethereum) { alert('Open this page in your wallet browser (Crypto.com, MetaMask, Trust Wallet)'); return; }
  try {
    var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    wallet = accounts[0];
    var chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (parseInt(chainId, 16) !== 25) {
      try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x19' }] }); } catch(e) {}
    }
    document.getElementById('walletArea').innerHTML =
      '<div class="wallet-badge" data-testid="deploy-farms-wallet">' + wallet.slice(0,6) + '...' + wallet.slice(-4) + '</div>';
    renderFarms();
  } catch(e) {}
}

async function createLPPair(idx) {
  var farm = FARMS[idx];
  if (!window.ethereum) { alert('Open in wallet browser!'); return; }
  try {
    farmStates[idx].loading = true; farmStates[idx].status = 'Connecting wallet...'; renderFarms();
    await connectWallet();

    var provider = new ethers.providers.Web3Provider(window.ethereum);
    var signer = provider.getSigner();
    var factory = new ethers.Contract(CONTRACTS.FACTORY, FACTORY_ABI, signer);

    farmStates[idx].status = 'Checking if pair exists...'; renderFarms();
    var existing = await factory.getPair(farm.addrA, farm.addrB);

    if (existing && existing !== ethers.constants.AddressZero) {
      localStorage.setItem(farm.storageKey, existing);
      farmStates[idx].lpAddr = existing;
      farmStates[idx].status = 'LP pair already exists!';
      farmStates[idx].loading = false;
      renderFarms(); return;
    }

    farmStates[idx].status = 'Creating LP pair — confirm in wallet...'; renderFarms();
    var tx = await factory.createPair(farm.addrA, farm.addrB);
    farmStates[idx].status = 'TX sent! Waiting for confirmation...'; renderFarms();
    await tx.wait();

    var pairAddr = await factory.getPair(farm.addrA, farm.addrB);
    if (!pairAddr || pairAddr === ethers.constants.AddressZero) {
      farmStates[idx].status = 'Error: LP pair creation failed — token may not exist on Cronos';
      farmStates[idx].loading = false;
      renderFarms(); return;
    }
    localStorage.setItem(farm.storageKey, pairAddr);
    farmStates[idx].lpAddr = pairAddr;
    farmStates[idx].status = 'LP pair created successfully!';
    farmStates[idx].loading = false;
    renderFarms();
  } catch(err) {
    console.error(err);
    var msg = err.code === 4001 ? 'Transaction rejected' :
              err.message && err.message.includes('insufficient') ? 'Not enough CRO for gas!' :
              (err.reason || err.message || 'Failed').slice(0, 120);
    farmStates[idx].status = 'Error: ' + msg;
    farmStates[idx].loading = false;
    renderFarms();
  }
}

async function addToMasterChef(idx) {
  var farm = FARMS[idx];
  var fs = farmStates[idx];
  if (!fs.lpAddr) { farmStates[idx].status = 'Create LP pair first!'; renderFarms(); return; }
  try {
    farmStates[idx].loading = true; farmStates[idx].status = 'Adding to MasterChef — confirm in wallet...'; renderFarms();

    var provider = new ethers.providers.Web3Provider(window.ethereum);
    var signer = provider.getSigner();
    var chef = new ethers.Contract(CONTRACTS.CHEF, CHEF_ABI, signer);

    var tx = await chef.addPool(farm.allocPoint, fs.lpAddr, { gasLimit: 500000 });
    farmStates[idx].status = 'TX sent! Waiting for confirmation...'; renderFarms();
    await tx.wait();

    farmStates[idx].chefAdded = true;
    farmStates[idx].status = 'Farm activated on MasterChef!';
    farmStates[idx].loading = false;
    renderFarms();
  } catch(err) {
    console.error(err);
    var msg = err.code === 4001 ? 'Transaction rejected' :
              err.message && err.message.includes('insufficient') ? 'Not enough CRO for gas!' :
              (err.reason || err.message || 'Failed').slice(0, 120);
    farmStates[idx].status = 'Error: ' + msg;
    farmStates[idx].loading = false;
    renderFarms();
  }
}

// Init — clean up any zero-address LP entries from failed creations
['FARM_LP_XRP_GANG','FARM_LP_PEPE_GANG','FARM_LP_DOGE_GANG'].forEach(function(key) {
  var val = localStorage.getItem(key);
  if (val && (val.replace(/0x0*/,'') === '' || val === '0x39e1B2f1B73810C611e83b733c2baF4A64C58C6e')) localStorage.removeItem(key);
});
farmStates = FARMS.map(function(f) {
  var lp = localStorage.getItem(f.storageKey) || '';
  if (lp && lp.replace(/0x0*/,'') === '') lp = '';
  return { lpAddr: lp, chefAdded: false, loading: false, status: '' };
});
renderFarms();
if (window.ethereum) connectWallet();
</script>

</body>
</html>
